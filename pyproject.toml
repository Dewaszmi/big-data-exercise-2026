[project]
name = "big-data-exercise-2026"
version = "0.1.0"
description = "Big Data 2026 — data engineering lifecycle on BTS flight delays"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1.0",
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.3.0",
    "kagglehub[polars-datasets]",
    "ipykernel",
    "matplotlib",
    "seaborn",
]

[project.scripts]
download-bts-data = "src.download_data:main"
profile-bts-data = "src.profiling:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
